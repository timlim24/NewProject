AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings app - backend API on AWS Lambda (container image + Lambda Web Adapter) and its
  PostgreSQL database on Aurora Serverless v2 (0-1 ACU, pauses when idle). The function runs
  in the database's private subnets and needs no internet access, so there is no NAT gateway.
  The database and the backend are created together.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z][a-z0-9-]*"
  ImageUri:
    Type: String
    Description: Full backend image URI including tag (pushed by `make deploy-backend`).
  DBPassword:
    Type: String
    NoEcho: true
    Description: >-
      Same value as the /<ProjectName>/db-password SecureString; passed in by the deploy script
      because Lambda environment variables cannot resolve SecureString references.
  CorsOrigins:
    Type: String
    Default: http://localhost:5173
    Description: >-
      Comma-separated origins allowed to call the API: the CloudFront address, the custom
      domain (if any) and CORS_ORIGINS_AWS. Kept up to date by the infra scripts.
  CognitoUserPoolId:
    Type: String
    Description: User pool whose ID tokens the API accepts (output of the auth stack).
  CognitoClientId:
    Type: String
    Description: App client the tokens must be issued to (output of the auth stack).
  CognitoJwks:
    Type: String
    Description: >-
      The user pool's signing keys (its jwks.json), fetched by the deploy script. The function
      has no internet access, so it cannot download them itself.
  MemorySize:
    Type: Number
    Default: 512
    Description: Lambda memory in MB (CPU scales with it).
  DBMinCapacity:
    Type: Number
    Default: 0
    Description: Minimum Aurora capacity units; 0 lets the database pause when idle (billed for storage only).
  DBMaxCapacity:
    Type: Number
    Default: 1
    Description: Maximum Aurora capacity units (1 ACU is about 2 GB of memory).
  DBAutoPauseSeconds:
    Type: Number
    Default: 300
    MinValue: 300
    MaxValue: 86400
    Description: Idle time before the database pauses (only with DBMinCapacity 0).
  DBName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"
  DBUser:
    Type: String
    Default: meetings
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"

Resources:
  # ---------------------------------------------------------------- Network
  # Private subnets only: the function talks to nothing but the database.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref ProjectName
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Two availability zones: required by RDS subnet groups, and keeps Lambda highly available.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-a
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-b
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --------------------------------------------------------- Security groups
  FunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Backend Lambda function (outbound only)
      VpcId: !Ref Vpc
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL, reachable only from the backend function
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref FunctionSecurityGroup
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ---------------------------------------------------------------- Database
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the backend database
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Database:
    Type: AWS::RDS::DBCluster
    Metadata:
      # cfn-lint's version list lags behind RDS; 17.11 is available (describe-db-engine-versions).
      cfn-lint:
        config:
          ignore_checks: [E3690]
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBClusterIdentifier: !Sub ${ProjectName}-db
      Engine: aurora-postgresql
      EngineVersion: "17.11"
      # Serverless v2: scales between the capacities below; at 0 ACU it pauses when idle
      # and resumes (in about 15 seconds) on the next connection.
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref DBMinCapacity
        MaxCapacity: !Ref DBMaxCapacity
        SecondsUntilAutoPause: !Ref DBAutoPauseSeconds
      StorageEncrypted: true
      DatabaseName: !Ref DBName
      MasterUsername: !Ref DBUser
      # SecureString created by infra/deploy-backend.sh (CloudFormation cannot create one).
      MasterUserPassword: !Sub "{{resolve:ssm-secure:/${ProjectName}/db-password}}"
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds: [!Ref DatabaseSecurityGroup]
      BackupRetentionPeriod: 1
      # Snapshots (including the final one on delete) keep the PROJECT_NAME tag.
      CopyTagsToSnapshot: true
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # A single serverless writer; the cluster's final snapshot covers the data on delete.
  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub ${ProjectName}-db-1
      DBClusterIdentifier: !Ref Database
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false
      EnablePerformanceInsights: false
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ------------------------------------------------------------------ Backend
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${ProjectName}/backend
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Network interfaces in the VPC + CloudWatch Logs.
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Function:
    Type: AWS::Lambda::Function
    # The cluster endpoint only accepts connections once its instance exists.
    DependsOn: DatabaseInstance
    Properties:
      FunctionName: !Sub ${ProjectName}-backend
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [x86_64]
      MemorySize: !Ref MemorySize
      # Covers a cold start: resuming a paused database + migrations check + app startup.
      Timeout: 60
      Role: !GetAtt FunctionRole.Arn
      VpcConfig:
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        SecurityGroupIds: [!Ref FunctionSecurityGroup]
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          DATABASE_URL: !Sub postgresql+asyncpg://${DBUser}:${DBPassword}@${Database.Endpoint.Address}:${Database.Endpoint.Port}/${DBName}
          CORS_ORIGINS: !Ref CorsOrigins
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_JWKS: !Ref CognitoJwks
          # One request per instance at a time; keeps database connections low as Lambda scales out.
          DB_POOL_SIZE: "1"
          DB_MAX_OVERFLOW: "1"
          # Lambda Web Adapter: forward requests to uvicorn once /api/health answers.
          AWS_LWA_PORT: "8000"
          AWS_LWA_READINESS_CHECK_PATH: /api/health
          AWS_LWA_ASYNC_INIT: "true"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE

  # Public: the browser calls it directly; the backend's CORS middleware limits which sites may.
  # A public function URL needs both permissions. (Function URLs and permissions have no tags.)
  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ApiBaseUrl:
    Description: Function URL without the trailing slash; the frontend is built against it
    Value: !Sub
      - https://${Domain}
      - Domain: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]
  ApiUrl:
    Description: Base URL of the API (direct, without CloudFront)
    Value: !Sub
      - https://${Domain}/api
      - Domain: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]
  DocsUrl:
    Value: !Sub
      - https://${Domain}/api/docs
      - Domain: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]
  FunctionName:
    Value: !Ref Function
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  LogGroup:
    Value: !Ref LogGroup
