AWSTemplateFormatVersion: "2010-09-09"
Description: Weekly meetings report infrastructure (S3, SQS, EventBridge Scheduler, Builder & Mailer Lambdas)

Parameters:
  ProjectName:
    Type: String
    Default: new-project
    Description: Prefix for resource names and tags
  ImageUri:
    Type: String
    Description: ECR container image URI for the backend / report builder
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where Aurora and backend Lambda reside
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for report builder Lambda
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group ID for report builder Lambda
  RouteTableId:
    Type: String
    Description: Route table ID where the S3 Gateway VPC endpoint will be attached
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: PostgreSQL connection URL for report builder
  SenderEmail:
    Type: String
    Description: Verified SES sender email address
  RecipientEmail:
    Type: String
    Description: Verified SES recipient email address (or comma-separated addresses)

Resources:
  # ------------------------------------------------------------------- S3 Bucket
  # Step 2: Private S3 bucket with 90-day expiration lifecycle rule
  # DependsOn MailerPermission avoids circular dependency with S3 bucket notifications
  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn: MailerPermission
    Properties:
      BucketName: !Sub ${ProjectName}-reports-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldReportsAfter90Days
            Status: Enabled
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt ReportMailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # S3 Gateway VPC Endpoint for private subnets so report-builder in VPC can reach S3
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref RouteTableId
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ------------------------------------------------------------------ SQS Queues
  # Step 4: Dead-letter queue for failed report requests
  ReportRequestsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-report-requests-dlq
      MessageRetentionPeriod: 1209600 # 14 days
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Primary queue for report requests with RedrivePolicy pointing to DLQ
  ReportRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-report-requests
      VisibilityTimeout: 360 # >= 6 * builder timeout (60s * 6 = 360s)
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ------------------------------------------------------- EventBridge Scheduler
  # Step 3: Role allowing EventBridge Scheduler to push messages to SQS
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SqsSendMessagePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Step 3 & 4: Scheduled trigger every Monday morning at 07:00 Kyiv time
  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${ProjectName}-weekly-report
      ScheduleExpression: "cron(0 7 ? * MON *)"
      ScheduleExpressionTimezone: "Europe/Kyiv"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"week": null, "source": "schedule"}'

  # ------------------------------------------------------ Report Builder Lambda
  BuilderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${ProjectName}/report-builder
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3PutReports
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*
        - PolicyName: SqsConsumeReports
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Builder function inside VPC, reusing backend image with custom handler command
  ReportBuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-report-builder
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - "app.reports.lambda_handler.handler"
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt BuilderRole.Arn
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
      LoggingConfig:
        LogGroup: !Ref BuilderLogGroup
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          REPORTS_BUCKET: !Sub ${ProjectName}-reports-${AWS::AccountId}
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Polls SQS queue with batch size 1
  BuilderEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !Ref ReportBuilderFunction
      BatchSize: 1

  # ------------------------------------------------------- Report Mailer Lambda
  # Step 5: Mailer function outside VPC, sends email via SES
  MailerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${ProjectName}/report-mailer
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3ReadReports
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*
        - PolicyName: SesSendEmail
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportMailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-report-mailer
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt MailerRole.Arn
      LoggingConfig:
        LogGroup: !Ref MailerLogGroup
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          RECIPIENT_EMAIL: !Ref RecipientEmail
      Code:
        ZipFile: |
          import json
          import logging
          import os
          import urllib.parse
          import boto3
          from email.message import EmailMessage

          logger = logging.getLogger("report_mailer")
          logger.setLevel(logging.INFO)

          s3 = boto3.client("s3")
          sesv2 = boto3.client("sesv2")

          def handler(event, context):
              # Required log line for item 5 of submission (trigger=s3)
              logger.info("report-mailer triggered trigger=s3", extra={"trigger": "s3", "event": event})

              sender = os.environ.get("SENDER_EMAIL")
              recipients_raw = os.environ.get("RECIPIENT_EMAIL", "")
              recipients = [r.strip() for r in recipients_raw.split(",") if r.strip()]

              if not sender or not recipients:
                  logger.error("Missing SENDER_EMAIL or RECIPIENT_EMAIL")
                  return {"statusCode": 400, "body": "Missing email configuration"}

              records = event.get("Records", [])
              for record in records:
                  bucket = record["s3"]["bucket"]["name"]
                  key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])
                  logger.info("Processing S3 report bucket=%s key=%s", bucket, key)

                  # Download report CSV
                  resp = s3.get_object(Bucket=bucket, Key=key)
                  csv_bytes = resp["Body"].read()

                  filename = key.split("/")[-1]
                  week = filename.replace(".csv", "")

                  # Build MIME message with attachment
                  msg = EmailMessage()
                  msg["Subject"] = f"Weekly Meetings Report: {week}"
                  msg["From"] = sender
                  msg["To"] = ", ".join(recipients)
                  msg.set_content(
                      f"Hello,\n\nAttached is your weekly meetings report for {week}.\n\nBest regards,\nMeetings App"
                  )
                  msg.add_attachment(
                      csv_bytes,
                      maintype="text",
                      subtype="csv",
                      filename=filename
                  )

                  # Send email via SESv2 raw content
                  sesv2.send_email(
                      FromEmailAddress=sender,
                      Destination={"ToAddresses": recipients},
                      Content={"Raw": {"Data": msg.as_bytes()}}
                  )
                  logger.info("Email delivered to %s for report %s", recipients, key)

              return {"statusCode": 200, "body": "Success"}
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Permission allowing S3 to invoke the Mailer Lambda
  MailerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReportMailerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}
      SourceAccount: !Ref AWS::AccountId

Outputs:
  ReportsBucket:
    Description: Name of the S3 reports bucket
    Value: !Ref ReportsBucket
  ReportRequestsQueue:
    Description: Name of the SQS queue for report requests
    Value: !GetAtt ReportRequestsQueue.QueueName
  ReportRequestsQueueUrl:
    Description: URL of the SQS queue for report requests
    Value: !Ref ReportRequestsQueue
  ReportRequestsDlq:
    Description: Name of the DLQ for failed report requests
    Value: !GetAtt ReportRequestsDlq.QueueName
  BuilderFunction:
    Description: Report builder Lambda function name
    Value: !Ref ReportBuilderFunction
  MailerFunction:
    Description: Report mailer Lambda function name
    Value: !Ref ReportMailerFunction
